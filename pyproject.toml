[project]
name = "drift-lab"
version = "0.1.0"
description = "Detecting and adapting to concept drift in time series forecasting"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "river>=0.21",
    "matplotlib>=3.8",
    "streamlit>=1.35",
    "nemosis>=3.8.1",
    "statsmodels>=0.15.0",
    "xgboost>=2.0",
    "neuralforecast>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["drift_lab*", "experiments*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
